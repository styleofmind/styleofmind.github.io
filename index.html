<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="Минималистичный каталог концептов Style of Mind. Выберите версию для просмотра.">
  <title>Концепты — Style of Mind</title>
  <style>
    :root{color-scheme:light;--paper:#f5f3ee;--ink:#252923;--muted:#777970;--line:#deded5;--card:#fbfaf7;--accent:#4b6251}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(1000px,calc(100% - 40px));margin:0 auto}
    .header{padding:clamp(38px,7vw,72px) 0 26px}
    .eyebrow{margin:0 0 10px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font:400 clamp(34px,5vw,48px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.04em}
    .catalog-meta{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 14px;padding-top:16px;border-top:1px solid var(--line)}
    .catalog-meta h2{margin:0;font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase}
    .catalog-meta p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap}
    .catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .card{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:94px;padding:18px 20px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:inherit;text-decoration:none;transition:border-color .16s,background .16s}
    .card:hover{border-color:#aeb8aa;background:#fff}
    .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .card-copy{display:grid;gap:5px;min-width:0}
    .version{font:400 27px/1 Georgia,"Times New Roman",serif;letter-spacing:-.035em}
    .label{color:var(--muted);font-size:12px;line-height:1.3}
    .arrow{flex:0 0 auto;color:var(--muted);font-size:19px;transition:transform .16s}
    .card:hover .arrow{transform:translate(2px,-2px);color:var(--accent)}
    .footer{margin:28px 0 36px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
    @media(max-width:700px){main{width:calc(100% - 32px)}.catalog{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{min-height:86px;padding:15px}.version{font-size:25px}}
    @media(max-width:360px){main{width:calc(100% - 24px)}.catalog{grid-template-columns:1fr}.card{min-height:76px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
<main>
  <header class="header">
    <p class="eyebrow">Style of Mind</p>
    <h1>Концепты</h1>
  </header>

  <section aria-labelledby="catalog-title">
    <div class="catalog-meta">
      <h2 id="catalog-title">Выберите версию</h2>
      <p>4 семейства · 9 версий</p>
    </div>
    <nav class="catalog" aria-label="Все концепты Style of Mind">
      <a class="card" href="./concepts/concept-0/v0.1/"><span class="card-copy"><span class="version">0.1</span><span class="label">Концепт 0</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card" href="./concepts/concept-0/v0.2/"><span class="card-copy"><span class="version">0.2</span><span class="label">Концепт 0</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card" href="./concepts/concept-0/v0.3/"><span class="card-copy"><span class="version">0.3</span><span class="label">Концепт 0</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card" href="./concepts/concept-1/v1.1/"><span class="card-copy"><span class="version">1.1</span><span class="label">Концепт 1</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card" href="./concepts/concept-1/v1.2/"><span class="card-copy"><span class="version">1.2</span><span class="label">Концепт 1</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card" href="./concepts/concept-2/v2.1/"><span class="card-copy"><span class="version">2.1</span><span class="label">Концепт 2</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card" href="./concepts/concept-2/v2.2/"><span class="card-copy"><span class="version">2.2</span><span class="label">Концепт 2</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card" href="./concepts/concept-2/v2.3/"><span class="card-copy"><span class="version">2.3</span><span class="label">Концепт 2</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="card" href="./concepts/concept-4/v4.1/"><span class="card-copy"><span class="version">4.1</span><span class="label">Концепт 4</span></span><span class="arrow" aria-hidden="true">↗</span></a>
    </nav>
  </section>

  <footer class="footer">Style of Mind · Каталог концептов</footer>
</main>
</body>
</html>
