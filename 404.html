<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="robots" content="noindex,follow">
  <title>Страница не найдена — Style of Mind</title>
  <style>
    :root { color-scheme: light; --paper: #f5f3ee; --ink: #252923; --muted: #777970; --line: #deded5; --card: #fbfaf7; --accent: #4b6251; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; min-height: 100dvh; place-items: center; margin: 0; padding: 28px; background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(560px, 100%); padding: clamp(28px, 6vw, 52px); border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    .eyebrow { margin: 0 0 18px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 15px; font: 400 clamp(34px, 7vw, 56px)/1.02 Georgia, "Times New Roman", serif; letter-spacing: -.045em; }
    p:not(.eyebrow) { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .actions a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 12px 17px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent); color: #fff; font-size: 13px; text-decoration: none; transition: background .2s ease, border-color .2s ease; }
    .actions a:hover { background: #3b5040; }
    .actions a.secondary { background: transparent; color: var(--accent); }
    .actions a.secondary:hover { background: rgba(75,98,81,.08); }
    .actions a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 520px) { .actions { flex-direction: column; } .actions a { width: 100%; } }
  </style>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="preload" href="/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <main>
    <p class="eyebrow">Style of Mind / Ошибка 404</p>
    <h1>Жизнь иногда отправляет не туда, куда хочется</h1>
    <p>Но даже если маршрут сбился, всегда можно найти верный путь. Начните с главной страницы или напишите Ольге — вместе разберёмся, куда двигаться дальше.</p>
    <nav class="actions" aria-label="Возможные пути">
      <a href="/">На главную ↗</a>
      <a class="secondary" href="https://t.me/olga_styleofmind" target="_blank" rel="noopener noreferrer">Написать в Telegram ↗</a>
    </nav>
  </main>
</body>
</html>
