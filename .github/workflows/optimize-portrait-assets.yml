name: Optimize portrait assets

on:
  push:
    branches:
      - main
    paths:
      - 'tools/optimize_portraits.py'
      - '.github/workflows/optimize-portrait-assets.yml'

permissions:
  contents: write

concurrency:
  group: portrait-asset-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate and validate WebP portrait variants
        run: python tools/optimize_portraits.py

      - name: Commit optimized variants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "development/концеп расстановки/concept-4/v4.1/assets/portraits/olga-hero-glasses-480.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/portraits/olga-hero-glasses-840.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/portraits/olga-hero-glasses-1123.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/portraits/olga-about-480.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/portraits/olga-about-720.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/portraits/olga-about-1024.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-01-mobile.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/about-watercolor-background.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-01.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-04.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-05.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-06.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-07.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-08-composed.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-09.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-10.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-11-composed.webp" \
            "development/концеп расстановки/concept-4/v4.1/assets/backgrounds/section-12.webp"
          if git diff --cached --quiet; then
            echo "No optimized portrait files to add."
            exit 0
          fi
          git commit -m "Add optimized responsive WebP portrait variants"
          git push origin HEAD:main

      - name: Confirm optimized variants
        if: always()
        run: git status --short --branch
